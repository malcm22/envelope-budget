<style>
:root{
  --bg:#f2f5fa; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#e0ebff;
  --warn:#e11d48; --warn-soft:#ffe4e9; --amber:#d97706; --amber-soft:#fff3d6;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b1020; --card:#151b2e; --ink:#f1f5fb; --muted:#94a3b8; --line:#263049;
  --accent:#4f8cff; --accent-ink:#ffffff; --accent-soft:#17264a;
  --warn:#ff5c7a; --warn-soft:#3a1622; --amber:#fbbf24; --amber-soft:#3a2c0c;
  --shadow:none;
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#0b1020; --card:#151b2e; --ink:#f1f5fb; --muted:#94a3b8; --line:#263049;

  --warn:#ff5c7a; --warn-soft:#3a1622; --amber:#fbbf24; --amber-soft:#3a2c0c;
  --shadow:none;
  color-scheme:dark;
}

.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}

nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--warn);color:#fff;border-radius:10px;font-size:10.5px;padding:1px 6px;font-weight:700}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;font-size:30px;font-weight:400;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:6;padding:0}

@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 14px;font-size:18px}

.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;padding:8px 2px;font-size:14px;border-radius:8px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.planrow{padding:12px 0;border-top:1px solid var(--line)}
.planrow:first-child{border-top:0}
.sticky-sum{position:sticky;top:0;z-index:3;margin:0 -16px;padding:10px 16px;background:var(--bg)}
:root{--vvh:100vh;--vvt:0px}
input,select{scroll-margin-top:120px;scroll-margin-bottom:24px}
body.typing nav.tabs, body.typing .fab{display:none}
body.typing{padding-bottom:40vh}
.sheet-bg{top:var(--vvt);bottom:auto;height:var(--vvh)}
.sheet{max-height:calc(var(--vvh) - 16px)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);line-height:1.45}
.hr{height:1px;background:var(--line);margin:14px 0}
</style>

<body>
<div class="wrap" id="app"><div class="empty">Loading…</div></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9l9 5 9-5"/></svg>Buckets</button>
  <button data-tab="activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Activity<span class="badge" id="inboxBadge" hidden></span></button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 4"/></svg>Plan</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2c2.7.2 5 2.3 5 5.8"/></svg>Household</button>
</div></nav>
<button class="fab" id="fab" hidden aria-label="Add a purchase">+</button>
<div id="sheetRoot"></div>

<script>
/* ===================== helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toCents = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isFinite(n) ? Math.round(n*100) : 0; };
const fmt = c => { const neg = c < 0; const s = (Math.abs(c)/100).toLocaleString('en-US',{style:'currency',currency:'USD'}); return neg ? '−'+s : s; };
const fmtIn = c => c ? (c/100).toFixed(2) : '';
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const nice = s => { if(!s) return ''; const d = parseYmd(s); const t = today(); if (s===t) return 'Today'; if (s===addDays(t,-1)) return 'Yesterday'; return d.toLocaleDateString('en-US',{month:'short',day:'numeric', year: d.getFullYear()!==new Date().getFullYear()?'numeric':undefined}); };
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const ord = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const UN = '_un';

/* ===================== theme ===================== */
function getTheme(){ try { return localStorage.getItem('theme') || 'auto'; } catch(e){ return S && S.theme || 'auto'; } }
function isDark(){ const t = document.documentElement.dataset.theme; return t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme(t){ if (t==='light'||t==='dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
function setTheme(t){ try { localStorage.setItem('theme', t); } catch(e){} if (typeof S!=='undefined') S.theme = t; applyTheme(t); render(); }
applyTheme((()=>{ try { return localStorage.getItem('theme'); } catch(e){ return null; } })());

/* ===================== state ===================== */
const S = {
  db:null, user:null, me:null, readOnly:false,
  cfg:null, cats:{}, txns:{}, pays:{}, moves:{},
  ready:{cfg:false,cats:false,txns:false,pays:false,moves:false},
  tab: (location.hash||'').replace('#','') || 'home',
  filter:'all', catchupDone:false, stale:false, openBucket:null
};
if (!['home','activity','plan','settings'].includes(S.tab)) S.tab='home';

const cfg = () => S.cfg || {};
const people = () => (cfg().people && cfg().people.length ? cfg().people : [{key:'p0',name:'Me',last4:'',uid:''}]);
const payEvery = () => cfg().payEvery === 14 ? 14 : 7;
const periodsPerYear = () => payEvery() === 14 ? 26 : 52;
const perLabel = () => payEvery() === 14 ? '/paycheck' : '/wk';
const periodWord = () => payEvery() === 14 ? 'pay period' : 'week';
const myPerson = () => people().find(p => p.uid && p.uid === S.me);
const personIdx = k => Math.max(0, people().findIndex(p => p.key===k));
const personName = k => (people().find(p=>p.key===k)||{}).name || '—';
const activeCats = () => Object.entries(S.cats).filter(([,c]) => !c.archived).sort((a,b) => (a[1].order??0)-(b[1].order??0) || a[1].name.localeCompare(b[1].name));
const live = o => Object.entries(o).filter(([,v]) => !v.void);

/* ===================== math ===================== */
function balances(){
  const b = {}; for (const k in S.cats) b[k] = 0;
  let un = 0, uncategorized = 0;
  for (const [,p] of live(S.pays)) {
    un += p.amount||0;
    for (const [c,a] of Object.entries(p.allocs||{})) { if (c in b) { b[c] += a; un -= a; } }
  }
  for (const [,m] of live(S.moves)) {
    const a = m.amount||0;
    if (m.from === 'outside') {} else if (m.from === UN) un -= a; else if (m.from in b) b[m.from] -= a; else continue;
    if (m.to === UN) un += a; else if (m.to in b) b[m.to] += a; else un += a;
  }
  for (const [,t] of live(S.txns)) {
    const a = (t.amount||0) * (t.refund ? -1 : 1);
    if (t.cat && t.cat in b) b[t.cat] -= a; else uncategorized += a;
  }
  const total = un + Object.values(b).reduce((s,v)=>s+v,0) - uncategorized;
  return { b, un, uncategorized, total };
}
function lastPayDate(){
  const ds = live(S.pays).map(([,p])=>p.date).filter(d => d <= today()).sort();
  return ds[ds.length-1] || null;
}
function weekStats(catId){
  const since = lastPayDate();
  let funded = 0, spent = 0;
  if (since) {
    for (const [,p] of live(S.pays)) if (p.date===since) funded += (p.allocs||{})[catId]||0;
    for (const [,t] of live(S.txns)) if (t.cat===catId && t.date>=since) spent += (t.amount||0)*(t.refund?-1:1);
  }
  return { since, funded, spent };
}
function planTotal(){ return activeCats().reduce((s,[,c]) => s + (c.perPay||0), 0); }
function inbox(){ return live(S.txns).filter(([,t]) => !t.cat && t.date).sort((a,b)=> (b[1].date||'').localeCompare(a[1].date||'')); }
function nextPayday(){ let d = cfg().startDate || today(), g = 0; while (d <= today() && g++ < 3000) d = addDays(d, payEvery()); return d; }
function goalInfo(k, bal){ return goalCalc(S.cats[k], bal); }
function goalCalc(c, bal){
  const target = c.goalAmount || 0; const need = Math.max(0, target - bal);
  let paychecks = null, suggest = null, eta = null;
  if (c.goalDate) { let d = nextPayday(), n = 0, g = 0; while (d <= c.goalDate && g++ < 3000) { n++; d = addDays(d, payEvery()); } paychecks = n; suggest = n > 0 ? Math.ceil(need / n) : null; }
  if (need > 0 && c.perPay > 0) eta = addDays(nextPayday(), (Math.ceil(need / c.perPay) - 1) * payEvery());
  return { target, need, paychecks, suggest, eta, done: target > 0 && bal >= target, late: !!(c.goalDate && eta && eta > c.goalDate) };
}
function hintHtml(v, bal){
  if (v.kind==='bill') {
    if (!v.billAmount) return v.varies ? 'Enter a typical monthly amount and the weekly amount fills in.' : 'Enter the bill amount and the weekly amount fills in.';
    const sug = suggestPerWeek(v.billAmount);
    return v.perPay===sug ? `Setting aside ${fmt(sug)}${perLabel()} to cover it ✓` : `Needs ${fmt(sug)}${perLabel()} to cover it (you set ${fmt(v.perPay||0)})`;
  }
  if (v.kind==='goal') {
    if (!v.goalAmount) return 'Enter a goal amount and the date you need it by.';
    const g = goalCalc(v, bal);
    if (g.done) return `Saved ${fmt(bal)}: goal reached ✓. Set the amount above to $0 to stop adding to it.`;
    if (g.suggest!=null) { const pc = `${g.paychecks} paycheck${g.paychecks>1?'s':''}`;
      return v.perPay===g.suggest ? `Saving ${fmt(v.perPay)}${perLabel()} for ${pc} to have ${fmt(v.goalAmount)} by ${nice(v.goalDate)} ✓` : `Needs ${fmt(g.suggest)}${perLabel()} for ${pc} to reach it by ${nice(v.goalDate)} (you set ${fmt(v.perPay||0)})`; }
    if (v.goalDate && g.paychecks===0) return 'No paydays left before that date.';
    return g.eta ? `At ${fmt(v.perPay)}${perLabel()} you'll reach it around ${nice(g.eta)}. Add a date to have the amount worked out for you.` : 'Add a date to have the weekly amount worked out, or type your own amount above.';
  }
  return '';
}
function sumHtml(pay, tot){

  return `<div class="card row" style="${left===0?'border-color:var(--accent)':''}"><div class="grow"><div class="sub">Each paycheck</div><div class="money" style="font-size:18px">${fmt(pay)}</div></div>
   <div style="text-align:right"><div class="sub">${left===0?'Every dollar planned':left>0?'Left to plan':'Over-planned by'}</div><div class="money ${left===0?'pos':left<0?'neg':''}" style="font-size:22px">${left===0?'$0.00 ✓':fmt(Math.abs(left))}</div></div></div>`;

function suggestPerWeek(monthly){ return Math.ceil(monthly*12/periodsPerYear()); }

/* ===================== storage adapter =====================
   Everything that reads or writes saved data goes through Store.
   This version uses claude.ai's built-in database. To self-host
   (Supabase), replace only this object; the rest of the app is unchanged. */
/* ===================== storage adapter (Supabase) =====================
   Same interface as the claude.ai version: watchDoc, watchCol, set, update, del, lock, wipe.
   Data lives in one table (docs) per household; live updates come over Supabase Realtime. */
const Store = {
  sb:null, user:null, hid:null, cache:{}, cbs:{}, chan:null, ready:false,
  async client(){
    if (this.sb) return this.sb;
    const C = window.BUDGET_CONFIG || {};
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm');
    this.sb = createClient(C.supabaseUrl, C.supabaseKey, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
    return this.sb;
  },
  async init(){
    const sb = await this.client();
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) return null;
    this.user = session.user;
    const { data: hid, error } = await sb.rpc('bootstrap');
    if (error) return { error: error.message };
    this.hid = hid;
    sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.reload(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.resync(); });
    return { me: this.user.id, readOnly: false };
  },
  key(path){ const i = path.indexOf('/'); return [path.slice(0,i), path.slice(i+1)]; },
  emit(coll){
    for (const cb of (this.cbs[coll]||[])) cb(coll === 'config' ? (this.cache.config && this.cache.config.main ? {...this.cache.config.main} : null) : {...(this.cache[coll]||{})}, true);
  },
  live(){
    if (this.chan) return;
    this.chan = this.sb.channel('docs-'+this.hid)
      .on('postgres_changes', { event:'*', schema:'public', table:'docs', filter:'household_id=eq.'+this.hid }, p => {
        const row = p.eventType === 'DELETE' ? p.old : p.new;
        if (!row || (row.household_id && row.household_id !== this.hid)) return;
        const c = this.cache[row.coll] || (this.cache[row.coll] = {});
        if (p.eventType === 'DELETE') delete c[row.id]; else c[row.id] = row.data;
        this.emit(row.coll);
      })
      .subscribe(status => { if (status === 'SUBSCRIBED' && this.ready) this.resync(); });
  },
  async fetchColl(coll){
    const out = {}; let from = 0;
    for (;;) {
      const { data, error } = await this.sb.from('docs').select('id,data').eq('household_id', this.hid).eq('coll', coll).range(from, from+999);
      if (error) throw { code:'unavailable', message:error.message };
      for (const r of data) out[r.id] = r.data;
      if (data.length < 1000) break; from += 1000;
    }
    this.cache[coll] = out; return out;
  },
  async resync(){
    try { for (const coll of Object.keys(this.cbs)) { await this.fetchColl(coll); this.emit(coll); } } catch(e){}
    if (typeof S !== 'undefined' && S.cfg) { S.catchupDone = false; maybeReady(); }
  },
  watch(coll, cb, err){
    (this.cbs[coll] || (this.cbs[coll] = [])).push(cb);
    this.live();
    this.fetchColl(coll).then(() => { this.ready = true; this.emit(coll); }).catch(e => err && err(e));
    return () => { this.cbs[coll] = (this.cbs[coll]||[]).filter(f => f !== cb); };
  },
  watchDoc(path, cb, err){ return this.watch(this.key(path)[0], cb, err); },
  watchCol(name, cb, err){ return this.watch(name, cb, err); },
  async set(path, data){
    const [coll, id] = this.key(path);
    (this.cache[coll] || (this.cache[coll] = {}))[id] = data; this.emit(coll);
    const { error } = await this.sb.from('docs').upsert({ household_id:this.hid, coll, id, data, updated_at:new Date().toISOString() });
    if (error) throw { code:'unavailable', message:error.message };
  },
  async update(path, patch){
    const [coll, id] = this.key(path);
    const c = this.cache[coll] || (this.cache[coll] = {});
    if (c[id]) { c[id] = { ...c[id], ...patch }; this.emit(coll); }
    const { error } = await this.sb.rpc('doc_update', { hid:this.hid, c:coll, i:id, patch });
    if (error) throw { code: error.code === 'P0002' ? 'invalid_argument' : 'unavailable', message:error.message };
  },
  async del(path){
    const [coll, id] = this.key(path);
    if (this.cache[coll]) { delete this.cache[coll][id]; this.emit(coll); }
    const { error } = await this.sb.from('docs').delete().eq('household_id', this.hid).eq('coll', coll).eq('id', id);
    if (error) throw { code:'unavailable', message:error.message };
  },
  async lock(name, holder, ttlMs){
    const { data, error } = await this.sb.rpc('try_lock', { hid:this.hid, lname:name, who:holder, ttl_ms:ttlMs });
    return !error && data === true;
  },
  async wipe(onProgress){
    const { error } = await this.sb.from('docs').delete().eq('household_id', this.hid);
    if (error) throw { code:'unavailable', message:error.message };
    this.cache = {}; for (const k of Object.keys(this.cbs)) this.emit(k); onProgress && onProgress();
  },
  fn(name, body){ return this.sb.functions.invoke(name, { body: { hid:this.hid, ...body } }); }
};

let loadTimer;
async function boot(){
  render();
  const info = await Store.init();
  if (!info) { showSignIn(); return; }
  if (info.error) { $('#app').innerHTML = `<div class="card empty">Couldn't open your budget: ${esc(info.error)}<br><br><button class="btn" onclick="location.reload()">Try again</button></div>`; return; }
  S.me = info.me; S.readOnly = info.readOnly;
  loadTimer = setTimeout(() => { S.stale = true; render(); }, 10000);
  const ok = k => confirmed => { if (confirmed) { S.ready[k] = true; maybeReady(); } };
  const err = e => { clearTimeout(loadTimer); toast('Could not load: ' + (e && e.message || 'error')); };
  Store.watchDoc('config/main', (d, conf) => { S.cfg = d; ok('cfg')(conf); render(); }, err);
  for (const k of ['cats','txns','pays','moves']) Store.watchCol(k, (o, conf) => { S[k] = o; ok(k)(conf); render(); }, err);
}
function allReady(){ return Object.values(S.ready).every(Boolean); }
function maybeReady(){
  if (allReady()) { clearTimeout(loadTimer); S.stale = false; if (!S.catchupDone) { S.catchupDone = true; catchUp(); } }
}
async function write(path, data, how='set'){
  if (S.readOnly) { toast("You have view-only access."); throw new Error('ro'); }
  try { await Store[how](path, data); }
  catch(e){
    if (e && e.code === 'unavailable') { await new Promise(r=>setTimeout(r, 600+Math.random()*800)); return Store[how](path, data); }
    if (e && e.code === 'invalid_argument' && how==='set') { S.readOnly = true; render(); }
    toast('Save failed: ' + (e && e.message || 'error')); throw e;
  }
}

/* Paydays + autopay bills: create what's due, once, guarded by a short lease */
async function catchUp(){
  const c = cfg();
  if (!S.cfg || S.readOnly) return;
  if (!(await Store.lock('lock', S.me || rid(), 20000))) return;
  const t = today();
  let made = 0;
  // Paydays
  if (c.startDate && c.pay > 0) {
    let d = c.startDate, guard = 0;
    while (d <= t && guard++ < 260) {
      const id = 'pay-' + d;
      if (!S.pays[id]) {
        const allocs = {};
        for (const [k,cat] of activeCats()) if (cat.perPay > 0) allocs[k] = cat.perPay;
        await write('pays/'+id, { date:d, amount:c.pay, allocs, auto:true, at:Date.now() });
        if (!S.pays[id]) S.pays[id] = { date:d, amount:c.pay, allocs }; made++;
      }
      d = addDays(d, payEvery());
    }
  }
  // Autopay bills
  for (const [k,cat] of activeCats()) {
    if (cat.kind !== 'bill' || !cat.autopay || !cat.billAmount || !cat.dueDay || !cat.since) continue;
    let y = +cat.since.slice(0,4), m = +cat.since.slice(5,7) - 1, guard = 0;
    while (guard++ < 60) {
      const last = new Date(y, m+1, 0).getDate();
      const due = ymd(new Date(y, m, Math.min(cat.dueDay, last)));
      if (due > t) break;
      if (due >= cat.since) {
        const id = 'bill-' + k + '-' + y + pad(m+1);
        if (!S.txns[id] && !realBillCharge(k, due.slice(0,7))) {
          const doc = { date:due, amount:cat.billAmount, desc:cat.name+(cat.varies?' (estimated)':' (autopay)'), cat:k, person:'', source:'autopay', estimate:!!cat.varies, at:Date.now() };
          await write('txns/'+id, doc);
          if (!S.txns[id]) S.txns[id] = doc; made++;
        }
      }
      m++; if (m > 11) { m = 0; y++; }
    }
  }
  if (made) toast(made === 1 ? 'Added 1 scheduled item' : `Added ${made} scheduled items (paydays/bills)`);
  await reconcileBills();
}
/* A real card charge in a bill bucket replaces that month's scheduled/estimated entry. */
function realBillCharge(k, ym){ return live(S.txns).some(([,t]) => t.cat===k && t.source!=='autopay' && !t.refund && t.date && t.date.slice(0,7)===ym); }
async function reconcileBills(){
  if (S.readOnly) return 0;
  let n = 0;
  for (const [id,t] of live(S.txns)) {
    if (t.source!=='autopay' || !t.cat || !S.cats[t.cat] || S.cats[t.cat].kind!=='bill') continue;
    if (realBillCharge(t.cat, (t.date||'').slice(0,7))) { try { await write('txns/'+id, {void:true, replaced:true}, 'update'); S.txns[id] = {...t, void:true}; n++; } catch(e){} }
  }
  if (n) toast(n===1 ? 'Bill updated to the actual charge' : `${n} bills updated to actual charges`);
  return n;
}
function billMatch(desc){
  const d = (desc||'').toUpperCase();
  for (const [k,c] of activeCats()) if (c.kind==='bill' && c.match) { for (const w of c.match.split(',').map(x=>x.trim().toUpperCase()).filter(Boolean)) if (d.includes(w)) return k; }
  return null;
}
function estimates(){ return live(S.txns).filter(([,t]) => t.estimate && t.source==='autopay'); }

    let sub, fill = 0, level = bal < 0 ? 'neg' : '';
    if (c.kind==='bill') {
      const ym = today().slice(0,7); const paid = live(S.txns).some(([,t]) => t.cat===k && t.date.slice(0,7)===ym && !t.refund);
      sub = paid ? 'paid ✓' : 'due the '+ord(c.dueDay||1);
      fill = c.billAmount ? bal / c.billAmount : 0;
      if (!paid && c.billAmount && bal < c.billAmount && !level) {
        const t = parseYmd(today()); let due = new Date(t.getFullYear(), t.getMonth(), Math.min(c.dueDay||1, new Date(t.getFullYear(), t.getMonth()+1, 0).getDate()));
        if (due < t) due = new Date(t.getFullYear(), t.getMonth()+1, Math.min(c.dueDay||1, new Date(t.getFullYear(), t.getMonth()+2, 0).getDate()));
        const dd = Math.round((due - t)/864e5);
        level = dd <= 7 ? 'neg' : dd <= 14 ? 'lowc' : '';
      }
    } else {
      const w = weekStats(k); sub = tilLabel; const base = Math.max(w.funded, bal + w.spent); fill = base ? bal / base : 0;
      const per = c.perPay || w.funded;
      if (!level && per > 0 && lastPayDate()) level = bal < per*0.2 ? 'neg' : bal < per*0.4 ? 'lowc' : '';
    }
    return `<button class="card bucket tile" data-bucket="${k}" style="--c:${col}"><div class="ticon">${catIcon(c)}</div><div class="name">${esc(c.name)}</div>
      <div class="money amt2 ${level}" style="${sz(str)}">${str}</div><div class="tsub ${level?'tsub-'+level:''}">${level==='neg'&&bal>=0?(c.kind==='bill'?'short for bill':'running low'):level==='lowc'?(c.kind==='bill'?'not enough yet':'getting low'):sub}</div>
      <div class="tbar"><i style="width:${bal<0?100:Math.max(0,Math.min(100,fill*100))}%;${level==='neg'?'background:var(--warn)':level==='lowc'?'background:var(--amber)':''}"></i></div></button>`;
  };
  const grid = list => `<div class="tiles">${list.map(tile).join('')}</div>`;
  if (spend.length) { const left = spend.reduce((s,[k])=>s+(b[k]||0),0); h += sec('Spending', short(left)+' left') + grid(spend); }
  if (bills.length) {
    const due = bills.reduce((s,[,c])=>s+(c.billAmount||0),0);
    const billCard = ([k,c]) => {
      const bal = b[k]||0, col = catColor(k), amt = c.billAmount||0;
      const t = parseYmd(today()); const ym = today().slice(0,7);
      const dueIn = (y,m) => new Date(y, m, Math.min(c.dueDay||1, new Date(y, m+1, 0).getDate()));
      const paid = live(S.txns).some(([,x]) => x.cat===k && x.date.slice(0,7)===ym && !x.refund);
      let next = dueIn(t.getFullYear(), t.getMonth()); if (paid || next < t) next = dueIn(t.getFullYear(), t.getMonth()+1);
      const nextStr = ymd(next); const dd = Math.round((next - t)/864e5);
      let n = 0, d = nextPayday(), g = 0; while (d <= nextStr && g++ < 60) { n++; d = addDays(d, payEvery()); }
      const projected = bal + n * (c.perPay||0);
      const ready = amt && bal >= amt;
      let st, cls = '';
      if (!amt) st = '<span class="st">set amount</span>';
      else if (ready) { st = '<span class="st ok">Ready ✓</span>'; }
      else if (projected >= amt) st = `<span class="st ok">On track</span>`;
      else { const short_ = amt - projected; cls = dd <= 7 ? 'neg' : 'lowc'; st = `<span class="st ${dd<=7?'bad':'late'}">Short ${short(short_)}</span>`; }
      const when = paid ? `✓ next ${parseYmd(nextStr).toLocaleDateString('en-US',{month:'short',day:'numeric'})}` : dd===0 ? 'due today' : `due in ${dd} day${dd>1?'s':''}`;
      return `<button class="card bucket goal bill" data-bucket="${k}" style="--c:${col}">${ring(amt ? bal/amt : 0, ready||projected>=amt ? col : cls==='neg' ? 'var(--warn)' : 'var(--amber)', 58)}
        <div class="gname">${catIcon(c)} ${esc(c.name)}</div><div class="money gamt ${cls}" style="${sz(fmt(bal))}">${fmt(bal)}</div>
        <div class="small muted">of ${short(amt)}</div><div class="tsub" style="margin:2px 0 0">${when}</div>${st}</button>`;
    };
    h += sec('Bills', short(due)+'/mo') + `<div class="goals bills">${bills.map(billCard).join('')}</div>`;
  }
  return h;
}

function txnRow([id,t], withSelect){
  const p = people(); const pi = personIdx(t.person);
  const initials = t.source==='autopay' ? '↻' : (personName(t.person)||'?').slice(0,1).toUpperCase();
  const cat = t.cat && S.cats[t.cat];
  const sel = withSelect && !t.cat ? `<select data-assign="${id}" ${S.readOnly?'disabled':''}><option value="">Pick a bucket…</option>${activeCats().map(([k,c])=>`<option value="${k}">${esc(c.name)}</option>`).join('')}</select>` : '';
  return `<div class="txn" data-txn="${id}"><div class="dot ${t.source==='autopay'?'':'p'+pi}">${esc(initials)}</div>
   <div class="grow"><div class="d">${esc(t.desc||'Purchase')}</div><div class="small muted">${nice(t.date)} · ${t.source==='autopay'?(t.estimate?'<span class="tag bill">estimated · tap to enter actual</span>':'Autopay'):esc(personName(t.person))}${cat&&!t.estimate?` · ${esc(cat.name)}`:''}${t.refund?' · refund':''}</div>${sel}</div>
   <div class="money ${t.refund?'pos':''}">${t.refund?'+':''}${fmt(t.amount||0)}</div></div>`;

function viewActivity(){
  const ib = inbox();
  const mp = myPerson();
  const f = S.filter;
  let h = `<div class="row"><div class="grow"><h1>Activity</h1></div><button class="btn ghost" id="importBtn">Import bank file</button></div>`;
  if (ib.length) {
    let list = ib; if (f==='mine' && mp) list = ib.filter(([,t])=>t.person===mp.key);
    h += `<h2>Needs a bucket</h2>${mp?`<div class="chips" style="margin-bottom:8px"><button class="chip ${f!=='mine'?'on':''}" data-filter="all">Everyone (${ib.length})</button><button class="chip ${f==='mine'?'on':''}" data-filter="mine">Mine (${ib.filter(([,t])=>t.person===mp.key).length})</button></div>`:''}
      <div class="card">${list.length?list.map(r=>txnRow(r,true)).join(''):'<div class="empty">Nothing of yours to sort.</div>'}</div>`;
  } else h += `<div class="banner ok" style="margin-top:10px">✓ Every purchase is in a bucket.</div>`;
  const est = estimates();
  if (est.length) h += `<h2>Confirm bill amounts</h2><div class="card">${est.map(([id,t]) => `<div class="txn"><div class="dot">↻</div><div class="grow"><div class="d">${esc(S.cats[t.cat]?S.cats[t.cat].name:'Bill')}</div><div class="small muted">${nice(t.date)} · estimated ${fmt(t.amount)}</div></div>
      <input data-est="${id}" inputmode="decimal" placeholder="Actual" style="width:96px;padding:8px"><button class="btn primary" data-estgo="${id}" style="padding:8px 10px">OK</button></div>`).join('')}</div>
    <p class="note" style="margin-top:6px">Or import your bank file. When the real charge comes in, it replaces the estimate on its own.</p>`;
  // Feed: txns + paydays + moves, last 60 days
  const cut = addDays(today(), -60);
  const items = [];
  for (const [id,t] of live(S.txns)) if (t.cat && t.date >= cut) items.push({date:t.date, at:t.at||0, html: txnRow([id,t], false)});
  for (const [id,p] of Object.entries(S.pays)) if (p.date >= cut) items.push({date:p.date, at:1, html:`<div class="txn" data-pay="${id}"><div class="dot" style="background:var(--accent-soft);color:var(--accent)">$</div><div class="grow"><div class="d">Payday${p.void?' (skipped)':''}</div><div class="small muted">${nice(p.date)} · base pay into buckets</div></div><div class="money ${p.void?'muted':'pos'}" ${p.void?'style="text-decoration:line-through"':''}>+${fmt(p.amount||0)}</div></div>`});
  for (const [id,m] of live(S.moves)) if (m.date >= cut) {
    const nm = k => k===UN?'Unassigned':k==='outside'?'Added money':(S.cats[k]?S.cats[k].name:'(deleted)');
    items.push({date:m.date, at:m.at||0, html:`<div class="txn" data-move="${id}"><div class="dot">⇄</div><div class="grow"><div class="d">${esc(nm(m.from))} → ${esc(nm(m.to))}</div><div class="small muted">${nice(m.date)}${m.note?' · '+esc(m.note):''}</div></div><div class="money muted">${fmt(m.amount||0)}</div></div>`});
  }
  items.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.at-a.at);
  h += `<h2>Last 60 days</h2><div class="card">${items.length?items.map(i=>i.html).join(''):'<div class="empty">Nothing yet.</div>'}</div>`;
  return h;
}

        <div><label>Shows on bank as</label><input data-f="match" value="${esc(cat.match||'')}" placeholder="e.g. CLARK PUD" autocapitalize="characters"></div></div>
        <div class="small muted hint" style="margin-top:6px">${hintHtml(cat, bals[k]||0)}</div>`:''}
      ${goal?`<div class="two" style="margin-top:8px"><div><label>Goal amount</label><input data-f="goalAmount" inputmode="decimal" value="${fmtIn(cat.goalAmount)}" placeholder="3,000.00"></div>
        <div><label>Need it by (optional)</label><input data-f="goalDate" type="date" value="${esc(cat.goalDate||'')}"></div></div>
        <div class="small muted hint" style="margin-top:6px">${hintHtml(cat, bals[k]||0)}</div>`:''}

  }

function bindView(){

  // welcome
  on('[data-wp]','input', e => { S.wizPeople[+e.target.dataset.wi][e.target.dataset.wp] = e.target.value; });
  const wn = $('#w_name'); if (wn) { wn.oninput = () => S.wizName = wn.value; $('#w_pay').oninput = e => S.wizPay = e.target.value; $('#w_every').onchange = e => S.wizEvery = e.target.value; $('#w_start').onchange = e => S.wizStart = e.target.value; }
  const wa = $('#w_addp'); if (wa) wa.onclick = () => { S.wizPeople.push({name:'',last4:''}); render(); };
  const go = $('#w_go'); if (go) go.onclick = async () => {
    const pay = toCents($('#w_pay').value); const start = $('#w_start').value;

    go.disabled = true;
    await write('config/main', { name: $('#w_name').value.trim(), pay, payEvery: +$('#w_every').value, startDate: start,
      people: ps.map((x,i)=>({key:'p'+i, name:x.name, last4:x.last4, uid: i===0 ? (S.me||'') : ''})) });

    const t = S.txns[id]; await write('txns/'+id, {amount:a, estimate:false, desc:(t.desc||'').replace(' (estimated)','')}, 'update'); toast(`${S.cats[t.cat]?S.cats[t.cat].name:'Bill'} set to ${fmt(a)}`); });

  on('[data-rmp]','click', e => { const i = +e.currentTarget.dataset.rmp; const x = people()[i];

async function saveRow(row, quiet){

/* ===================== CSV import ===================== */
function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i=0;i<text.length;i++){
    const ch = text[i];
    if (q) { if (ch==='"' && text[i+1]==='"'){cur+='"';i++;} else if (ch==='"') q=false; else cur+=ch; }
    else if (ch==='"') q=true; else if (ch===',') { row.push(cur); cur=''; }
    else if (ch==='\n' || ch==='\r') { if (ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); cur=''; if (row.some(x=>x.trim())) rows.push(row); row=[]; }
    else cur+=ch;
  }
  row.push(cur); if (row.some(x=>x.trim())) rows.push(row);
  return rows;
}
function toYmd(s){
  s = (s||'').trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) { const y = m[3].length===2?'20'+m[3]:m[3]; return y+'-'+pad(m[1])+'-'+pad(m[2]); }
  const d = new Date(s); return isNaN(d) ? null : ymd(d);
}
function analyzeCSV(rows){
  const head = rows[0].map(h=>h.toLowerCase().trim());
  const find = (...names) => head.findIndex(h => names.some(n => h.includes(n)));
  const iDate = find('posting date','transaction date','date'), iDesc = find('description','payee','merchant','memo','name');
  const iAmt = head.findIndex(h => h==='amount' || h.includes('amount')), iDebit = find('debit','withdrawal'), iCredit = find('credit','deposit');
  const iCard = find('card');
  const out = [];
  for (const r of rows.slice(1)) {
    const date = toYmd(r[iDate]); if (!date) continue;
    let amt = 0;
    if (iDebit>=0 && (r[iDebit]||'').trim()) amt = -Math.abs(toCents(r[iDebit]));
    else if (iCredit>=0 && (r[iCredit]||'').trim()) amt = Math.abs(toCents(r[iCredit]));
    else if (iAmt>=0) { const raw = r[iAmt]||''; amt = toCents(raw); if (/^\(.*\)$/.test(raw.trim())) amt = -Math.abs(amt); }
    if (amt >= 0) continue; // deposits (pay, overtime) are ignored on purpose
    const desc = (r[iDesc]||'').trim().replace(/\s+/g,' ');
    const blob = (iCard>=0 ? r[iCard] : '') + ' ' + desc;
    const who = people().find(p => p.last4 && blob.includes(p.last4));
    out.push({ date, amount:-amt, desc, person: who ? who.key : '' });
  }
  return { out, ok: iDate>=0 && (iAmt>=0 || iDebit>=0) };
}
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(36); }
function openImportSheet(){
  sheet(`<h3>Import from your bank</h3><p class="note">Download recent transactions as a <b>CSV</b> from your bank's website, then choose the file here. Card purchases come in under “Needs a bucket”. Deposits (paychecks, overtime) are skipped, and anything already imported is skipped too.</p>
   <input type="file" id="csv" accept=".csv,text/csv" style="margin-top:8px"><div id="csvOut" class="note" style="margin-top:12px"></div>
   <div class="field" id="whoWrap" hidden><label>Purchases with no card number go to</label><select id="csvWho"><option value="">Nobody (sort later)</option>${people().map(x=>`<option value="${x.key}">${esc(x.name)}</option>`).join('')}</select></div>
   <div class="row" style="margin-top:14px"><span class="grow"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="csvGo" disabled>Import</button></div>`,
  el => {
    let parsed = [];
    el.querySelector('#csv').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      const rows = parseCSV(await f.text()); if (rows.length < 2) { el.querySelector('#csvOut').textContent = 'That file looks empty.'; return; }
      const {out, ok} = analyzeCSV(rows);
      if (!ok) { el.querySelector('#csvOut').textContent = "Couldn't find Date and Amount columns in that file."; return; }
      const seen = {}; parsed = out.map(t => { const base = t.date+'|'+t.amount+'|'+t.desc; seen[base] = (seen[base]||0)+1; return {...t, id:'csv-'+hashStr(base+'#'+seen[base])}; }).filter(t => !S.txns[t.id]);
      const auto = parsed.filter(t=>t.person).length;
      el.querySelector('#csvOut').innerHTML = parsed.length ? `<b>${parsed.length} new purchase${parsed.length>1?'s':''}</b> found (${out.length-parsed.length} already here). ${auto} matched to a card.` : 'Nothing new to import.';
      el.querySelector('#whoWrap').hidden = !(parsed.length - auto);
      el.querySelector('#csvGo').disabled = !parsed.length;
    };
    el.querySelector('#csvGo').onclick = async () => {
      const def = el.querySelector('#csvWho').value; const btn = el.querySelector('#csvGo'); btn.disabled = true;
      if (parsed.length > 300) { toast('Importing the newest 300'); parsed = parsed.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,300); }
      let n = 0;
      for (const t of parsed) { btn.textContent = `Importing ${++n}/${parsed.length}`; const cat = billMatch(t.desc); await write('txns/'+t.id, {date:t.date, amount:t.amount, desc:t.desc, person:t.person||def, cat, source:'csv', at:Date.now()}); S.txns[t.id] = {date:t.date, amount:t.amount, cat, source:'csv'}; }
      await reconcileBills();
      closeSheet(); toast(`Imported ${parsed.length}`); setTab('activity');
    };
  });
}

/* ===================== keyboard handling =====================
   When the phone keyboard opens, hide the bottom bar and keep the field
   being typed in centered in the part of the screen that's still visible. */
(function(){
  const isField = el => el && el.matches && el.matches('input:not([type=checkbox]):not([type=file]),select,textarea');
  const vv = window.visualViewport;
  const sync = () => {
    if (vv) { document.documentElement.style.setProperty('--vvh', vv.height+'px'); document.documentElement.style.setProperty('--vvt', vv.offsetTop+'px'); }
  };
  const reveal = () => {
    const el = document.activeElement; if (!isField(el)) return;
    const inSheet = el.closest('.sheet');
    try { el.scrollIntoView({ block: inSheet ? 'nearest' : 'center', behavior: 'smooth' }); } catch(e){ el.scrollIntoView(); }
  };
  let t1, t2;
  document.addEventListener('focusin', e => {
    if (!isField(e.target) || e.target.type==='date') { if (isField(e.target)) document.body.classList.add('typing'); return; }
    document.body.classList.add('typing');
    clearTimeout(t1); clearTimeout(t2);
    t1 = setTimeout(reveal, 120); t2 = setTimeout(reveal, 450);   // after the keyboard finishes opening
  });
  document.addEventListener('focusout', () => setTimeout(() => { if (!isField(document.activeElement)) document.body.classList.remove('typing'); }, 80));
  if (vv) { vv.addEventListener('resize', () => { sync(); clearTimeout(t2); t2 = setTimeout(reveal, 60); }); vv.addEventListener('scroll', sync); sync(); }
  window.addEventListener('resize', () => { clearTimeout(t2); t2 = setTimeout(reveal, 60); });
})();

/* ===================== self-hosted extras =====================
   Sign-in, household invites, bank connection (Plaid), notifications, starting balances, home-screen app. */
const SV = { bank:null, members:null, invites:null, pushOn:null, busy:false };
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const C_ = window.BUDGET_CONFIG || {};

/* ---------- sign-in ---------- */
function showSignIn(step, email){
  $('#tabs').hidden = true; $('#fab').hidden = true;
  const app = $('#app');
  if (step !== 'code') {
    app.innerHTML = `<div style="max-width:420px;margin:8vh auto 0">
      <img src="icons/icon-192.png" alt="" width="64" height="64" style="border-radius:15px;margin-bottom:14px;box-shadow:0 6px 18px rgba(37,99,235,.25)">
      <h1>${esc(C_.appName || 'Budget')}</h1><p class="sub">Sign in with your email. We'll send you a 6-digit code — no password.</p>
      <div class="card stack" style="margin-top:16px"><div class="field"><label>Email</label><input id="si_email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" value="${esc(email||'')}"></div>
      <button class="btn primary full" id="si_send">Email me a code</button></div>
      <p class="note" style="text-align:center;margin-top:14px">Invited by someone? Use the email they invited.</p></div>`;
    const go = async () => {
      const em = $('#si_email').value.trim().toLowerCase(); if (!/^\S+@\S+\.\S+$/.test(em)) return toast('Enter your email');
      $('#si_send').disabled = true; $('#si_send').textContent = 'Sending…';
      const sb = await Store.client();
      const { error } = await sb.auth.signInWithOtp({ email: em, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
      if (error) { toast(error.message); $('#si_send').disabled = false; $('#si_send').textContent = 'Email me a code'; return; }
      showSignIn('code', em);
    };
    $('#si_send').onclick = go; $('#si_email').onkeydown = e => { if (e.key === 'Enter') go(); };
    return;
  }
  app.innerHTML = `<div style="max-width:420px;margin:8vh auto 0"><h1>Check your email</h1><p class="sub">We sent a code to <b>${esc(email)}</b>. It can take a minute; check spam too.</p>
    <div class="card stack" style="margin-top:16px"><div class="field"><label>6-digit code</label><input id="si_code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" style="font-size:26px;letter-spacing:.3em;text-align:center"></div>
    <button class="btn primary full" id="si_verify">Sign in</button><button class="btn ghost full" id="si_back">Use a different email</button></div></div>`;
  const verify = async () => {
    const code = $('#si_code').value.replace(/\D/g,''); if (code.length < 6) return toast('Enter the code from the email');
    $('#si_verify').disabled = true; $('#si_verify').textContent = 'Checking…';
    const sb = await Store.client();
    const { error } = await sb.auth.verifyOtp({ email, token: code, type: 'email' });
    if (error) { toast(error.message.includes('expired') ? 'That code expired. Send a new one.' : 'That code didn\'t work. Try again.'); $('#si_verify').disabled = false; $('#si_verify').textContent = 'Sign in'; return; }
    location.reload();
  };
  $('#si_verify').onclick = verify; $('#si_code').oninput = e => { if (e.target.value.replace(/\D/g,'').length === 6) verify(); };
  $('#si_back').onclick = () => showSignIn('email', email);
  setTimeout(() => $('#si_code') && $('#si_code').focus(), 50);
}

/* ---------- Household screen cards ---------- */
async function loadServerInfo(){
  if (SV.busy || !Store.sb || !Store.hid) return; SV.busy = true;
  try {
    const sb = Store.sb, hid = Store.hid;
    const [b, m, i, pc] = await Promise.all([
      sb.rpc('bank_status', { hid }), sb.from('members').select('user_id,email').eq('household_id', hid),
      sb.from('invites').select('email').eq('household_id', hid), sb.rpc('my_push_count', { hid })
    ]);
    SV.bank = b.data || []; SV.members = m.data || []; SV.invites = i.data || [];
    SV.pushOn = (pc.data || 0) > 0 && typeof Notification !== 'undefined' && Notification.permission === 'granted';
  } catch(e){} finally { SV.busy = false; }
  if (S.tab === 'settings') render();
}
function viewServerCards(){
  if (SV.bank === null) { loadServerInfo(); return `<h2>Bank & notifications</h2><div class="card empty">Loading…</div>`; }
  let h = `<h2>Who's in this budget</h2><div class="card">`;
  h += SV.members.map(m => `<div class="txn"><div class="dot">${esc((m.email||'?')[0].toUpperCase())}</div><div class="grow"><div class="d">${esc(m.email||'')}</div><div class="small muted">${m.user_id===S.me?'You':'Member'}</div></div></div>`).join('');
  h += SV.invites.map(v => `<div class="txn"><div class="dot">✉️</div><div class="grow"><div class="d">${esc(v.email)}</div><div class="small muted">Invited · joins when they sign in</div></div><button class="btn ghost" data-uninv="${esc(v.email)}" style="color:var(--warn)">Cancel</button></div>`).join('');
  h += `<div class="row" style="margin-top:10px"><input id="inv_email" type="email" inputmode="email" placeholder="Their email"><button class="btn" id="inv_go">Invite</button></div>
    <p class="note" style="margin-bottom:0">Then send them this link: <b>${esc(location.origin + location.pathname)}</b> and have them sign in with that email.</p></div>`;

  // bank
  h += `<h2>Bank connection</h2><div class="card">`;
  if (SV.bank.length) {
    h += SV.bank.map(b => `<div class="row"><div class="ticon" style="--c:#2563eb">🏦</div><div class="grow"><b>${esc(b.institution||'Your bank')}</b><div class="small ${b.last_error?'neg':'muted'}">${b.last_error ? 'Needs attention: '+esc(b.last_error) : b.last_sync ? 'Last checked '+new Date(b.last_sync).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : 'Connected'}</div><div class="small muted">Purchases from ${nice(b.start_date)} on</div></div></div>`).join('');
    h += `<div class="two" style="margin-top:12px"><button class="btn" id="bank_sync">Check for new purchases</button><button class="btn" id="bank_fix">${SV.bank.some(b=>b.last_error)?'Reconnect':'Connect another'}</button></div>
      <button class="btn ghost full danger" id="bank_unlink" style="margin-top:6px">Disconnect bank</button>`;
  } else {
    h += `<p class="note" style="margin-top:0">Connect your checking account so card purchases show up here on their own. The app only reads purchases; it can't move money, and it ignores your bank balance and deposits.</p>
      <button class="btn primary full" id="bank_link">Connect bank</button>`;
  }
  h += `</div>`;

  // notifications
  const supported = 'serviceWorker' in navigator && 'PushManager' in window && typeof Notification !== 'undefined';
  h += `<h2>Notifications on this phone</h2><div class="card">`;
  if (isIOS && !isStandalone()) h += `<p class="note" style="margin-top:0">On iPhone, notifications only work from the home-screen app. In Safari tap <b>Share</b> → <b>Add to Home Screen</b>, open <b>Budget</b> from the home screen, sign in, and come back here.</p>`;
  else if (!supported) h += `<p class="note" style="margin-top:0">This browser can't show notifications. Try Chrome or Samsung Internet on Android, or the home-screen app on iPhone.</p>`;
  else if (SV.pushOn) h += `<div class="row"><span class="tag green">On ✓</span><span class="grow small muted">${myPerson()?`For purchases on ${esc(myPerson().name)}'s card`:'Tap “This is me” above so you only get your card\'s purchases'}</span></div>
      <div class="two" style="margin-top:12px"><button class="btn" id="push_test">Send a test</button><button class="btn" id="push_off">Turn off</button></div>`;
  else if (Notification.permission === 'denied') h += `<p class="note" style="margin-top:0">Notifications are blocked for this site. Allow them in your phone's settings for this app, then come back.</p>`;
  else h += `<p class="note" style="margin-top:0">Get a notification each time ${myPerson()?'your':'a'} card is used, asking which bucket it was for.</p><button class="btn primary full" id="push_on">Turn on notifications</button>`;
  h += `</div>`;
  return h;
}

function bindServer(){
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach(el => el.addEventListener(ev, fn));
  const ig = $('#inv_go'); if (ig) ig.onclick = async () => {
    const em = $('#inv_email').value.trim().toLowerCase(); if (!/^\S+@\S+\.\S+$/.test(em)) return toast('Enter their email');
    const { error } = await Store.sb.from('invites').insert({ household_id: Store.hid, email: em });
    if (error && !/duplicate/.test(error.message)) return toast(error.message);
    toast('Invited ' + em); SV.bank = null; render();
  };
  on('[data-uninv]', 'click', async e => { await Store.sb.from('invites').delete().eq('household_id', Store.hid).eq('email', e.currentTarget.dataset.uninv); SV.bank = null; render(); });
  const bl = $('#bank_link'); if (bl) bl.onclick = () => connectBank();
  const bf = $('#bank_fix'); if (bf) bf.onclick = () => connectBank();
  const bs = $('#bank_sync'); if (bs) bs.onclick = async () => {
    bs.disabled = true; bs.textContent = 'Checking…';
    const { data, error } = await Store.fn('plaid', { action:'sync' });
    const n = (data && data.results || []).reduce((s,r)=>s+(r.added||0),0);
    toast(error ? 'Check failed: ' + (error.message||'error') : n ? `${n} purchase${n>1?'s':''} updated` : 'No new purchases yet');
    SV.bank = null; render();
  };
  const bu = $('#bank_unlink'); if (bu) bu.onclick = () => sheet(`<h3>Disconnect your bank?</h3><p class="note">Purchases already here stay. New ones won't come in until you connect again.</p><div class="two" style="margin-top:14px"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ul_go" style="background:var(--warn);border-color:var(--warn)">Disconnect</button></div>`,
    el => el.querySelector('#ul_go').onclick = async () => { await Store.fn('plaid', { action:'unlink' }); closeSheet(); SV.bank = null; render(); toast('Bank disconnected'); });
  const po = $('#push_on'); if (po) po.onclick = () => enablePush(po);
  const pt = $('#push_test'); if (pt) pt.onclick = async () => { const { data, error } = await Store.fn('plaid', { action:'test_push', person:(myPerson()||{}).key||'' }); toast(error ? 'Test failed' : data && data.sent ? 'Test sent' : 'No phones signed up yet'); };
  const pf = $('#push_off'); if (pf) pf.onclick = async () => {
    try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) { await Store.sb.rpc('delete_push_sub', { ep: sub.endpoint }); await sub.unsubscribe(); } } catch(e){}
    SV.bank = null; render(); toast('Notifications off on this phone');
  };
  const so = $('#s_signout'); if (so) so.onclick = async () => { await Store.sb.auth.signOut(); location.reload(); };
  const ss = $('#s_start'); if (ss) ss.onclick = openStartSheet;
  const sbn = $('#startBanner'); if (sbn) sbn.onclick = openStartSheet;
}
// The Buckets screen banner is bound here too (bindView runs bindServer on every screen).

/* ---------- notifications ---------- */
function b64ToBytes(s){ const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...b].map(c => c.charCodeAt(0))); }
async function enablePush(btn){
  try {
    btn.disabled = true; btn.textContent = 'Turning on…';
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Notifications weren\'t allowed'); btn.disabled = false; btn.textContent = 'Turn on notifications'; return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(C_.vapidPublicKey) });
    const j = sub.toJSON();
    const { error } = await Store.sb.rpc('save_push_sub', { hid: Store.hid, ep: j.endpoint, k_p256dh: j.keys.p256dh, k_auth: j.keys.auth, pkey: (myPerson()||{}).key || '' });
    if (error) throw error;
    toast('Notifications on'); SV.bank = null; render();
  } catch(e) { toast('Couldn\'t turn on notifications: ' + (e.message||e)); btn.disabled = false; btn.textContent = 'Turn on notifications'; }
}
// Keep this phone's notifications pointed at the right person after "This is me".
async function refreshPushPerson(){
  try {
    if (!('serviceWorker' in navigator) || Notification.permission !== 'granted') return;
    const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (!sub) return;
    const j = sub.toJSON(); await Store.sb.rpc('save_push_sub', { hid: Store.hid, ep: j.endpoint, k_p256dh: j.keys.p256dh, k_auth: j.keys.auth, pkey: (myPerson()||{}).key || '' });
  } catch(e){}
}

/* ---------- bank connection (Plaid Link) ---------- */
function loadScript(src){ return new Promise((ok, bad) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
async function connectBank(resumeUri){
  try {
    let token = null;
    if (resumeUri) { try { token = localStorage.getItem('plaid_link_token'); } catch(e){} }
    if (!token) {
      toast('Opening secure bank login…');
      const { data, error } = await Store.fn('plaid', { action:'link_token' });
      if (error || !data || !data.link_token) { const msg = data && data.error || (error && (await error.context?.json?.().catch(()=>null))?.error) || (error && error.message) || 'error'; return toast('Couldn\'t start bank login: ' + msg); }
      token = data.link_token; try { localStorage.setItem('plaid_link_token', token); } catch(e){}
    }
    await loadScript('https://cdn.plaid.com/link/v2/stable/link-initialize.js');
    const handler = Plaid.create({
      token, receivedRedirectUri: resumeUri || undefined,
      onSuccess: async (public_token, md) => {
        toast('Saving your bank…');
        const { data, error } = await Store.fn('plaid', { action:'exchange', public_token, institution: md && md.institution && md.institution.name, start_date: today() });
        if (error || (data && data.error)) return toast('Couldn\'t save the bank: ' + ((data && data.error) || error.message));
        try { localStorage.removeItem('plaid_link_token'); } catch(e){}
        toast('Bank connected ✓'); SV.bank = null; if (resumeUri) history.replaceState(null, '', location.pathname + '#settings'); setTab('settings');
      },
      onExit: (err) => { if (err) toast(err.display_message || err.error_message || 'Bank login closed'); }
    });
    handler.open();
  } catch(e) { toast('Bank login failed: ' + (e.message||e)); }
}

/* ---------- starting balances ---------- */
function openStartSheet(){
  const cats = activeCats(); const b = balances().b;
  const cur = k => { const m = S.moves['start-'+k]; return m && !m.void ? m.amount : 0; };
  sheet(`<h3>Starting balances</h3><p class="note" style="margin-top:-6px">How much is already set aside in each bucket today. Leave blank for $0. Your weekly paydays add on top of this.</p>
    <div class="stack">${cats.map(([k,c]) => `<div class="row"><span class="ticon" style="--c:${catColor(k)};margin:0">${catIcon(c)}</span><span class="grow" style="font-weight:600">${esc(c.name)}</span><input data-start="${k}" inputmode="decimal" placeholder="0.00" value="${fmtIn(cur(k))}" style="width:120px;text-align:right"></div>`).join('')}
    <div class="row"><span class="ticon" style="--c:#64748b;margin:0">📥</span><span class="grow" style="font-weight:600">Not in a bucket yet</span><input data-start="${UN}" inputmode="decimal" placeholder="0.00" value="${fmtIn(cur(UN))}" style="width:120px;text-align:right"></div></div>
    <div class="row" style="margin-top:16px"><span class="grow small muted" id="st_total"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="st_save">Save</button></div>`,
  el => {
    const tot = () => { let s = 0; el.querySelectorAll('[data-start]').forEach(i => s += toCents(i.value)); el.querySelector('#st_total').textContent = 'Total ' + fmt(s); };
    el.querySelectorAll('[data-start]').forEach(i => i.oninput = tot); tot();
    el.querySelector('#st_save').onclick = async () => {
      const btn = el.querySelector('#st_save'); btn.disabled = true; btn.textContent = 'Saving…';
      for (const i of el.querySelectorAll('[data-start]')) {
        const k = i.dataset.start, v = toCents(i.value), id = 'start-'+k, had = S.moves[id];
        if (v > 0) { if (!had || had.amount !== v || had.void) await write('moves/'+id, { date: today(), from:'outside', to:k, amount:v, note:'Starting balance', at:Date.now() }); }
        else if (had) await Store.del('moves/'+id);
      }
      if (S.cfg && S.cfg.startDone !== true) await write('config/main', { startDone:true }, 'update');
      closeSheet(); toast('Starting balances saved');
    };
  });
}

/* ---------- home-screen app, notification taps, bank login return ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message', ev => { if (ev.data && ev.data.open) openFromNotification(ev.data.open); });
}
function openFromNotification(id){
  const tryOpen = (n=0) => { if (allReady() && S.txns[id]) { setTab('activity'); openTxnSheet(id); } else if (n < 40) setTimeout(() => tryOpen(n+1), 250); };
  tryOpen();
}
(function(){
  const q = new URLSearchParams(location.search);
  const t = q.get('t'), oauth = q.get('oauth_state_id');
  if (t || oauth) history.replaceState(null, '', location.pathname + (oauth ? '#settings' : '#activity'));
  if (t) openFromNotification(t);
  if (oauth) { const wait = (n=0) => { if (Store.hid && allReady()) connectBank(location.origin + location.pathname + '?' + q.toString()); else if (n < 60) setTimeout(() => wait(n+1), 250); }; wait(); }
})();
// re-save who this phone belongs to whenever "This is me" changes
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('[data-claim]')) setTimeout(refreshPushPerson, 1500); });

boot();
</script>
